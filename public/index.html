<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Remoção de Servidores</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=dm-sans:400,500,600,700|jetbrains-mono:400,500" rel="stylesheet" />

  <!-- Vuetify CSS -->
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3.7.6/dist/vuetify.min.css" rel="stylesheet" integrity="sha384-eJmlp/COxhx24FloCbtq1p0DDqM2SKpgC7rV6auNw82iFEgIs+lUpdF3icfOsjs9" crossorigin="anonymous" />
  <!-- Material Design Icons -->
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" integrity="sha384-HphS8cQyN+eYiJ5PMbzShG6qZdRtvHPVLPkYb8JwMkmNgaIxrFVDhQe3jIbq3EZ2" crossorigin="anonymous" />

  <link rel="stylesheet" href="/css/custom.css" />
</head>

<body>
  <div id="app">
    <v-app>
      <!-- Loading state -->
      <v-main v-if="!appReady" class="d-flex align-center justify-center" style="min-height:100vh">
        <v-progress-circular indeterminate color="primary" size="64"></v-progress-circular>
      </v-main>

      <!-- App Layout (quando autenticado) -->
      <template v-else-if="authStore.isLoggedIn">
        <app-layout></app-layout>
      </template>

      <!-- Login (quando não autenticado) -->
      <template v-else>
        <login-page></login-page>
      </template>
    </v-app>
  </div>

  <!-- Vue 3 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js" integrity="sha384-W/1Fp/LgAYO/oTn9Gs+PbeWuMuq1eQCnUMPCeg8POmMYchhzxctjEqtbiCIxDOON" crossorigin="anonymous"></script>
  <!-- Vue Router -->
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4.5.0/dist/vue-router.global.prod.js" integrity="sha384-fKhZ7XFlx1XxZ69zuElETNwLMIEVbnq6fLGrT0qMuLVEtFnTTQUeQZETOSFgDJa0" crossorigin="anonymous"></script>
  <!-- Vue Demi (required by Pinia IIFE build) -->
  <script src="https://cdn.jsdelivr.net/npm/vue-demi@0.14.10/lib/index.iife.js" integrity="sha384-emd9ekwT9gDO8wZ5c85ynSQGfyL5Gb8yZYtzFZsiHVKpEwuWRJrzTBLVclKnjLrv" crossorigin="anonymous"></script>
  <!-- Pinia -->
  <script src="https://cdn.jsdelivr.net/npm/pinia@2.3.1/dist/pinia.iife.prod.js" integrity="sha384-hE48qoZieVYBVmPBCEUl243tazLCjCZTiZf8iJqc2FCHvtqwqIPk8bn0u4w6I01I" crossorigin="anonymous"></script>
  <!-- Vuetify -->
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.6/dist/vuetify.min.js" integrity="sha384-ifms89UoFWn4HZtF27YHk8x+AqYzhCrxXRJqSYknfHXQ/CtDeyv/Y2NC1+Abfz5g" crossorigin="anonymous"></script>

  <!-- Stores -->
  <script src="/js/stores/auth.js"></script>
  <script src="/js/stores/cidades.js"></script>
  <script src="/js/stores/servidores.js"></script>
  <script src="/js/stores/processamento.js"></script>
  <script src="/js/stores/config.js"></script>

  <!-- Views -->
  <script src="/js/views/Login.js"></script>
  <script src="/js/views/admin/Dashboard.js"></script>
  <script src="/js/views/admin/Distribuicao.js"></script>
  <script src="/js/views/admin/Servidores.js"></script>

  <script src="/js/views/admin/Testes.js"></script>
  <script src="/js/views/usuario/Perfil.js"></script>
  <script src="/js/views/usuario/Intencao.js"></script>

  <!-- Components -->
  <script src="/js/components/AppLayout.js"></script>

  <!-- SheetJS (Excel/CSV) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
  <!-- jsPDF & AutoTable (PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js" integrity="sha384-b8MpgG2ZzWN6OPAtiB1JiBmDr9MpTt3NKK6KQf61hC/L7X4wJrvoTeVmMFPgp3nL" crossorigin="anonymous"></script>

  <!-- Utils -->
  <script src="/js/utils/exporter.js"></script>

  <!-- App -->
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
</body>

</html>
